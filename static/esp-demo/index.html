<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>ESP32 Live Demo</title>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface-2: #181c25;
    --line: #232834;
    --text: #eef1f7;
    --muted: #8993a8;
    --accent: #7c9cff;
    --ok: #3ddc97;
    --warn: #ffb547;
    --bad: #ff5d6c;
    --c: #000000;               /* current LED colour, set from JS */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
      var(--bg);
    transition: background .4s ease;
    -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 6px; }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 550; color: var(--muted);
    padding: 7px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    max-width: 60%;
  }
  .pill span#status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 2s infinite; }
  .pill.ok { color: var(--text); }
  .pill.bad .dot { background: var(--bad); }
  .pill.bad { color: var(--bad); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.55); } 70%,100% { box-shadow: 0 0 0 8px rgba(61,220,151,0); } }

  .card {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 22px;
  }
  .label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  /* LED preview */
  .led { text-align: center; }
  .orb-wrap { position: relative; margin: 20px auto 16px; width: 168px; height: 168px; }
  .orb {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 38%),
      var(--c);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08) inset,
      0 0 60px 6px color-mix(in srgb, var(--c) 55%, transparent),
      0 0 140px 20px color-mix(in srgb, var(--c) 28%, transparent);
    transition: background .25s ease, box-shadow .25s ease;
  }
  .hex { font-family: var(--mono); font-size: 15px; letter-spacing: .06em; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  /* Swatches */
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
  .sw {
    appearance: none; border: 0; padding: 0; cursor: pointer;
    aspect-ratio: 1; border-radius: 50%; position: relative;
    background: var(--s);
    box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sw:active { transform: scale(.9); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .sw.off { background: #0d0f14; }
  .sw.off::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 2px; background: var(--muted); transform: rotate(-45deg); border-radius: 2px; }
  .sw.custom { background: conic-gradient(#ff3b3b, #ffd600, #22e06b, #00d4ff, #3b5bff, #c13bff, #ff3b3b); overflow: hidden; }
  .sw.custom input { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); opacity: 0; cursor: pointer; }
  .sw.custom::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }

  /* Counter */
  .counter { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .counter .n {
    font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .counter .n.bump { animation: bump .45s ease; }
  @keyframes bump { 0% { transform: scale(1); color: var(--text); } 30% { transform: scale(1.18); color: var(--accent); } 100% { transform: scale(1); color: var(--text); } }
  .btn-icon {
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; color: var(--muted);
  }
  .btn-icon i { width: 18px; height: 18px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px rgba(255,255,255,.06); }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding-top: 4px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>ESP32 Live Demo<small>Everyone here controls the same LED</small></h1>
    <div class="pill" id="pill"><i class="dot"></i><span id="status">connecting…</span></div>
  </header>

  <section class="card led">
    <div class="label">LED colour</div>
    <div class="orb-wrap"><div class="orb"></div></div>
    <div class="hex" id="hex">#000000</div>
    <div class="hint">Tap a colour &mdash; the real LED changes within a second</div>
    <div class="swatches" id="swatches"></div>
  </section>

  <section class="card counter">
    <div>
      <div class="label">Button presses on the board</div>
      <div class="n" id="count">0</div>
    </div>
    <div class="btn-icon" aria-hidden="true"><i></i></div>
  </section>

  <footer>Press the BOOT button on the ESP32 and watch the counter</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- FILL THESE IN (anon/publishable key is meant to be public) ----
  const SUPABASE_URL = "https://dvwifuksrgxwluymlcig.supabase.co";
  const SUPABASE_KEY = "sb_publishable_bhXhq0n3VBFNcwBK9sRr0Q_nyhA7eWi";
  // --------------------------------------------------------------------

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const pill = $("pill"), statusEl = $("status"), countEl = $("count"), hexEl = $("hex");
  const swatchBox = $("swatches");

  const toHex = ({ r, g, b }) =>
    "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
  const fromHex = h => ({
    r: parseInt(h.slice(1, 3), 16),
    g: parseInt(h.slice(3, 5), 16),
    b: parseInt(h.slice(5, 7), 16),
  });

  function setStatus(text, kind) {
    statusEl.textContent = text;
    pill.className = "pill" + (kind ? " " + kind : "");
  }

  // ---- colour swatches ------------------------------------------------
  const PRESETS = ["#ff2d2d", "#ff8a00", "#ffd600", "#22e06b", "#00d4ff",
                   "#2f6bff", "#a259ff", "#ff4fa3", "#ffffff", "#000000"];
  const swButtons = [];
  PRESETS.forEach(hex => {
    const b = document.createElement("button");
    b.className = "sw" + (hex === "#000000" ? " off" : "");
    b.style.setProperty("--s", hex);
    b.setAttribute("aria-label", hex === "#000000" ? "LED off" : "Colour " + hex);
    b.setAttribute("aria-pressed", "false");
    b.dataset.hex = hex;
    b.addEventListener("click", () => { paint(hex); send(fromHex(hex)); });
    swatchBox.appendChild(b);
    swButtons.push(b);
  });
  const custom = document.createElement("label");
  custom.className = "sw custom";
  custom.setAttribute("aria-label", "Custom colour");
  const picker = document.createElement("input");
  picker.type = "color"; picker.value = "#000000";
  custom.appendChild(picker);
  swatchBox.appendChild(custom);

  // ---- rendering ------------------------------------------------------
  let shown = null;
  function paint(hex) {
    shown = hex;
    document.documentElement.style.setProperty("--c", hex);
    hexEl.textContent = hex === "#000000" ? "LED off" : hex.toUpperCase();
    swButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.hex === hex)));
    if (document.activeElement !== picker) picker.value = hex;
  }

  let lastCount = null;
  function render(row) {
    paint(toHex(row));
    if (lastCount !== null && row.press_count !== lastCount) {
      countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump");
    }
    lastCount = row.press_count;
    countEl.textContent = row.press_count;
  }

  // ---- data -----------------------------------------------------------
  sb.from("demo_state").select("*").eq("id", 1).single()
    .then(({ data }) => data && render(data));

  sb.channel("demo_state_changes")
    .on("postgres_changes",
        { event: "UPDATE", schema: "public", table: "demo_state" },
        p => render(p.new))
    .subscribe(s => {
      if (s === "SUBSCRIBED") setStatus("live", "ok");
      else if (s === "CONNECTING" || s === "JOINING") setStatus("connecting…");
      else setStatus(s.toLowerCase().replace(/_/g, " "), "bad");
    });

  const send = async rgb => {
    const { data, error } = await sb.from("demo_state").update(rgb).eq("id", 1).select();
    if (error) setStatus("send failed: " + error.message, "bad");
    else if (!data || !data.length) setStatus("send blocked: 0 rows updated", "bad");
  };

  // custom colour: throttled while dragging, final value on release
  let last = 0;
  picker.addEventListener("input", e => {
    paint(e.target.value);
    const now = Date.now();
    if (now - last < 150) return;
    last = now;
    send(fromHex(e.target.value));
  });
  picker.addEventListener("change", e => send(fromHex(e.target.value)));
</script>
</body>
</html>
